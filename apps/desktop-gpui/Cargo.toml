[package]
name = "desktop-gpui"
version = "0.1.0"
description = "Native GPUI client for the YAADE terminal multiplexer"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
base64 = "0.22"
crossbeam-channel = "0.5"
gpui = { git = "https://github.com/zed-industries/zed", rev = "cff3ac6f93f506330034652f0d2389591bfb45a0", features = ["runtime_shaders"] }
gpui-ghostty-terminal = { path = "../../crates/gpui-ghostty-terminal" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tungstenite = "0.28"
url = "2.5"
uuid = { version = "1.18", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
