[workspace]
members = ["."]
resolver = "2"

[package]
name = "yaade-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
async-channel = "2.5"
env_logger = "0.11"
futures-util = "0.3"
gpui = { version = "=0.2.2", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["macros", "net", "rt", "time"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
ureq = { version = "3.1", features = ["json"] }
url = "2.5"
uuid = { version = "1.18", features = ["v4"] }
vt100 = "0.16"

[target.'cfg(target_os = "macos")'.dependencies]
# Compile GPUI's standard Metal shaders at runtime so local contributors only
# need the macOS Command Line Tools. Release builders with full Xcode may drop
# this feature to precompile the same shaders during packaging.
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "wayland", "x11"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
