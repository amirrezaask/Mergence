[package]
name = "yaade-server"
version = "0.0.1"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8", features = ["http2", "ws"] }
base64 = "0.22"
bytes = "1.10"
futures-util = "0.3"
hostname = "0.4"
indexmap = "2.12"
jiff = "0.2"
mime_guess = "2.0"
portable-pty = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.48", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip", "fs", "limit", "trace"] }
url = "2.5"
uuid = { version = "1.18", features = ["v4", "serde"] }

[dev-dependencies]
pretty_assertions = "1.4"
