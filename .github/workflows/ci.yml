name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: 22.18.0
          run-install: false
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: vp install --frozen-lockfile
      - run: vp run build:web
      - run: vp exec playwright install --with-deps chromium
      - run: vp run typecheck
      - run: vp run test
      - run: vp run build
      - run: vp run test:web:e2e
        env:
          YAADE_E2E_RUN_FLAKY: "1"
      - run: vp exec playwright test --project=security-e2e
        env:
          JET_SKIP_E2E_BUILD: "1"

  runtime-platform:
    name: Runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: 22.18.0
          run-install: false
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: vp install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/yaade/ghostty
            ~/.cache/zig
          key: ghostty-${{ matrix.os }}-zig-0.15.2-${{ hashFiles('packages/ghostty-core/src/vendor/VERSION') }}
      - run: vp run prepare:ghostty
      - run: vp run check:ghostty-source
      - run: cargo fmt --manifest-path crates/ghostty-vt-sys/Cargo.toml -- --check
      - run: cargo test --manifest-path crates/ghostty-vt-sys/Cargo.toml
      - run: cargo test --release --manifest-path crates/ghostty-vt-sys/Cargo.toml
      - run: cargo clippy --manifest-path crates/ghostty-vt-sys/Cargo.toml --all-targets -- -D warnings
      - if: runner.os == 'Linux'
        run: cargo run --manifest-path crates/ghostty-vt-sys/Cargo.toml --features bindgen-tool --bin gen-bindings -- --check
      - run: vp run typecheck
      - run: cargo fmt --manifest-path apps/server/Cargo.toml -- --check
      - run: cargo clippy --manifest-path apps/server/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/server/Cargo.toml
      - run: cargo build --release --locked --manifest-path apps/server/Cargo.toml
      - run: vp test packages/yaade-host-client
      - run: vp run test:terminal:unit
      - run: vp run test:terminal:protocol
      - run: vp run test:terminal:integration
