<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' http: https: ws: wss:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'"
    />
    <title>YAADE</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("jet-color-scheme")
          var themeId = localStorage.getItem("jet-theme-id") || ""
          var lightLegacy = themeId === "catppuccin-latte" || themeId === "tokyonight-day"
          var scheme = raw === "light" || raw === "dark"
            ? raw
            : raw === "system"
              ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
              : themeId === "default-light" || lightLegacy ? "light" : "dark"
          if (scheme === "dark") document.documentElement.classList.add("dark")
          document.documentElement.dataset.yaadeSurface = "default"
        } catch (_) {
          document.documentElement.classList.add("dark")
          document.documentElement.dataset.yaadeSurface = "default"
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
